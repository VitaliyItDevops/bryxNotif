# Railway Configuration for Bryx Telegram Bot
# This is a separate service from CRM

[build]
builder = "NIXPACKS"
buildCommand = "dotnet publish BryxBot/BryxBot.csproj -c Release -o /app/publish"

[deploy]
startCommand = "dotnet /app/publish/BryxBot.dll"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# ============================================
# Environment Variables for Bot
# ============================================
# These will be set in Railway dashboard:
# - BOT_TOKEN (Telegram bot token)
# - CRM_API_URL (URL of your CRM service, e.g., https://your-crm.railway.app/api/bot/)
# - ALLOWED_USERS (comma-separated Telegram IDs)
# - ASPNETCORE_ENVIRONMENT=Production
