# Railway Configuration for Bryx CRM + Bot
# https://docs.railway.app/deploy/config-as-code

# ============================================
# CRM Service (ASP.NET Blazor Server)
# ============================================
# Note: This configuration uses Dockerfile for reliable builds
# Railway will automatically detect and use bryx CRM/Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "bryx CRM/Dockerfile"

[deploy]
startCommand = "dotnet bryx_CRM.dll"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# ============================================
# Environment Variables for CRM
# ============================================
# Set these in Railway dashboard:
# - DATABASE_URL (automatically provided by Railway PostgreSQL plugin)
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_CHAT_ID
# - RAILWAY_VOLUME_MOUNT_PATH (for backups)
# - ASPNETCORE_ENVIRONMENT=Production
# - PORT (Railway will set automatically)
